<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% seo %}
</head>
<body>

<header class="site-nav">
  <div class="wrap nav-inner">
    <div class="nav-mark">MF<span>_</span>cloud engineer</div>
    <nav class="nav-links">
      <a href="#summary">Overview</a>
      <a href="#experience">Experience</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<main>
  {{ content }}
</main>

<footer id="contact">
  <div class="wrap">
    <div class="contact-grid">
      <h2>Let's build something that has to work.</h2>
      <div class="contact-links">
        <a href="mailto:{{ site.email }}">{{ site.email }}</a>
        <a href="tel:{{ site.phone | replace: ' ', '' }}">{{ site.phone }}</a>
        <a href="{{ site.linkedin_url }}" target="_blank" rel="noopener">{{ site.linkedin }}</a>
        <a href="{{ site.github_url }}" target="_blank" rel="noopener">{{ site.github }}</a>
      </div>
    </div>
    <div class="foot-bottom">
      <span>© {{ site.time | date: '%Y' }} {{ site.author }}</span>
      <span>{{ site.location }}</span>
    </div>
  </div>
</footer>

<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
